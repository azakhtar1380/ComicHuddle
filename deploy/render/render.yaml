services:
  - type: web
    name: comichuddle-sandbox
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        value: comic-huddle-db.chioa264chm8.us-east-2.rds.amazonaws.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: VISION_GATEWAY_URL
        sync: false
      - key: VISION_GATEWAY_KEY
        sync: false
      - key: SANDBOX_MODE
        value: "true"
  - type: cron
    name: comichuddle-weekly-releases
    runtime: docker
    region: ohio
    plan: starter
    schedule: "0 9 * * 1"
    dockerCommand: node dist/sync-new-releases.js
    envVars:
      - key: DB_HOST
        fromService: {name: comichuddle-sandbox, type: web, envVarKey: DB_HOST}
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        fromService: {name: comichuddle-sandbox, type: web, envVarKey: DB_PASSWORD}
      - key: DB_SSL
        value: "true"
      - key: METRON_API_TOKEN
        sync: false
      - key: GCD_RELEASE_FEED_URL
        sync: false
      - key: MARVEL_RELEASE_FEED_URL
        sync: false
      - key: SOURCE_METADATA_RIGHTS_REFERENCE
        sync: false
      - key: IMAGE_ALLOWED_ORIGINS
        sync: false
      - key: SOURCE_ALLOWED_ORIGINS
        sync: false
      - key: COVER_RIGHTS_MANIFEST_JSON
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: COVER_CDN_ORIGIN
        sync: false
